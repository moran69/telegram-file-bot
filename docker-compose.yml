services:
  telegram-bot:
    build: .
    container_name: telegram-tdl-forwarder
    restart: "on-failure:3"
    stop_grace_period: 30s
    volumes:
      - ./history:/data/history
      - monitor-data:/data/monitor
      - type: bind
        source: /usr/local/bin/tdl
        target: /usr/local/bin/tdl
        read_only: true
        bind:
          create_host_path: false
      - ~/.tdl:/root/.tdl
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      API_ID: "${API_ID:?请在 .env 中设置 API_ID}"
      API_HASH: "${API_HASH:?请在 .env 中设置 API_HASH}"
      # Validate in the bot process so gen-session can run with only the two API credentials.
      BOT_TOKEN: "${BOT_TOKEN:-}"
      ADMIN_IDS: "${ADMIN_IDS:-}"
      SUBMITTER_IDS: "${SUBMITTER_IDS:-}"
      FORWARD_TO_CHAT_ID: "${FORWARD_TO_CHAT_ID:-}"
      MONITOR_CHAT_IDS: "${MONITOR_CHAT_IDS:-}"
      MONITOR_TDL_FALLBACK: "${MONITOR_TDL_FALLBACK:-1}"
      FORWARD_LOG_FILE: /data/history/forward_history.json
      MONITOR_MAP_FILE: /data/monitor/message_map.sqlite3
      MONITOR_MAP_RETENTION_DAYS: "${MONITOR_MAP_RETENTION_DAYS:-7}"
      USER_MONITOR_ENABLED: "${USER_MONITOR_ENABLED:-1}"
      USER_SESSION_STRING: "${USER_SESSION_STRING:-}"
      AUTO_DELETE_BOT_MESSAGES: "${AUTO_DELETE_BOT_MESSAGES:-1}"
      AUTO_DELETE_STATUS_SECONDS: "${AUTO_DELETE_STATUS_SECONDS:-300}"
      AUTO_DELETE_COMMAND_SECONDS: "${AUTO_DELETE_COMMAND_SECONDS:-120}"
      AUTO_DELETE_ERROR_SECONDS: "${AUTO_DELETE_ERROR_SECONDS:-600}"
      AUTO_DELETE_SYNC_RECEIPT_SECONDS: "${AUTO_DELETE_SYNC_RECEIPT_SECONDS:-0}"

  gen-session:
    build: .
    container_name: telegram-tdl-forwarder-gen-session
    profiles:
      - tools
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      API_ID: "${API_ID:?请在 .env 中设置 API_ID}"
      API_HASH: "${API_HASH:?请在 .env 中设置 API_HASH}"
    command: python3 -u gen_telethon_session.py
    stdin_open: true
    tty: true

volumes:
  monitor-data:
